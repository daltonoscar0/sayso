name: tests

on:
  push:
  pull_request:

jobs:
  cpp:
    name: C++ grammars and classifier
    runs-on: ubuntu-latest

    steps:
      # The Makefile expects the Scalpel tokeniser at ../Scalpel, so both
      # repositories are checked out side by side under the workspace.
      - name: Check out sayso
        uses: actions/checkout@v4
        with:
          path: sayso

      # KNOWN FAILURE until Scalpel's Irish-mutation work is merged.
      # classify.cpp, symbols.cpp and text.cpp all include
      # ../Scalpel/utf8.h, and that header does not exist on Scalpel's main
      # branch -- it arrives with the mutation_fst layer
      # (daltonoscar0/Scalpel#1). So this job cannot build until that merges,
      # after which it should go green with no change here.
      # Deliberately tracking main rather than pinning to that PR's branch,
      # which will be deleted on merge.
      - name: Check out Scalpel
        uses: actions/checkout@v4
        with:
          repository: daltonoscar0/Scalpel
          ref: main
          path: Scalpel

      - name: Compiler version
        run: g++ --version

      - name: Build
        working-directory: sayso
        run: make

      # 210 tests across seven binaries, no dependencies. The eval harness is
      # dev tooling and needs corpus data that is not in the repo, so `make
      # eval` is not run here.
      - name: Run the C++ tests
        working-directory: sayso
        run: make test

  python:
    name: Python contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[test]'

      # KNOWN FAILURE: the src/sayso/ package is missing from the repository.
      # The .gitignore entry for the compiled `sayso` binary also matched the
      # src/sayso/ directory, so the Python sources were never committed, and
      # these tests cannot import the package. This job is expected to fail
      # until src/sayso/*.py is committed. Deliberately not skipped or marked
      # continue-on-error: the failure is real and should stay visible.
      - name: Run the Python tests
        run: pytest
